name: Game quality
on:
  push:
    branches: [main]
    paths: ['dist/**', '*tests.mjs', 'package.json', 'package-lock.json', 'scripts/vendor-qr.mjs', 'wrangler.jsonc', '.github/workflows/quality.yml']
  pull_request:
    paths: ['dist/**', '*tests.mjs', 'package.json', 'package-lock.json', 'scripts/vendor-qr.mjs', 'wrangler.jsonc', '.github/workflows/quality.yml']
permissions:
  contents: read
concurrency:
  group: game-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run check
